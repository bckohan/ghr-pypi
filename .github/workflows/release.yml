name: Publish Release

permissions:
  contents: read

concurrency:
  # stop previous release runs if tag is recreated
  group: release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      # CalVer tags, e.g. v2026.8.5 or v2026.8.5.1
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+"

jobs:
  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  test:
    permissions:
      contents: read
      id-token: write # to allow codecov oidc upload
    uses: ./.github/workflows/test.yml

  build:
    name: Build Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      PACKAGE_NAME: ${{ steps.set-package.outputs.package_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14" # for tomllib
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: false
          restore-cache: false
          save-cache: false
      - name: Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - name: Verify Tag
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "Verifying tag $TAG_NAME..."
          # if a tag was deleted and recreated we may have the old one cached
          # be sure that we're publishing the current tag!
          git fetch --force origin refs/tags/$TAG_NAME:refs/tags/$TAG_NAME

          # verify signature
          curl -sL "https://github.com/${GITHUB_ACTOR}.gpg" | gpg --import
          git tag -v "$TAG_NAME"

          # verify version
          RELEASE_VERSION=$(just validate_version $TAG_NAME)

          # export the release version
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> $GITHUB_ENV

          # hatchling reads this to stamp every wheel/sdist built below
          echo "PACKAGE_VERSION=${RELEASE_VERSION}" >> $GITHUB_ENV
      - name: Build the binary wheel and a source tarball
        run: just build
      - name: Store the distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-package-distributions
          path: dist/
      - name: Build the demo packages
        run: |
          uv build --project packages/demo-lib --out-dir demo-dist
          uv build --project packages/demo-app --out-dir demo-dist
      - name: Store the demo distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: demo-package-distributions
          path: demo-dist/
      - name: Set Package Name
        id: set-package
        run: |
          PACKAGE_NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['name'])")
          echo "package_name=${PACKAGE_NAME}" >> $GITHUB_OUTPUT

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/${{ needs.build.outputs.PACKAGE_NAME }}
    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-to-pypi:
    name: Publish to PyPI
    needs:
      - lint
      - test
      - build
      - publish-to-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.build.outputs.PACKAGE_NAME }}
    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - build
    permissions:
      contents: write # IMPORTANT: mandatory for making GitHub Releases
      id-token: write # IMPORTANT: mandatory for sigstore
      actions: write # dispatch the pages workflow after the release exists

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-package-distributions
          path: dist/
      # both artifacts merge into dist/ — safe only while package filenames stay distinct
      - name: Download the demo distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: demo-package-distributions
          path: dist/
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: false

      # PEP 658: publish each wheel's core METADATA as a sibling release
      # asset so link-mode indexes can serve dependency metadata. Running
      # from dist/ uses the version being released — no PyPI round trip.
      - name: Extract PEP 658 metadata from wheels
        run: uvx --from dist/ghr_pypi-*.whl ghr-pypi extract-meta dist/
      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" ||
          gh release create
          "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --generate-notes
      - name: Upload artifact signatures to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # Upload to GitHub Release using the `gh` CLI.
        # `dist/` contains the built packages, and the
        # sigstore-produced signatures and certificates.
        run: >-
          gh release upload
          "$GITHUB_REF_NAME" dist/**
          --repo "$GITHUB_REPOSITORY"
          --clobber
      # Releases created with GITHUB_TOKEN do not fire `release` events in
      # other workflows (GitHub suppresses them to prevent recursion), so
      # trigger the Pages rebuild explicitly.
      - name: Rebuild the Pages index
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml
