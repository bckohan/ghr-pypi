# Regenerates the PEP 503 package index from GitHub release assets and
# deploys it to GitHub Pages. Runs on releases (created or deleted by hand),
# on any push to main (e.g. to pick up index script changes), on manual
# dispatch, and is triggered explicitly by release.yml (releases created
# with GITHUB_TOKEN do not fire `release` events).
#
# It also accepts a `ghr-pypi-rebuild` repository_dispatch, which is how a
# release in *another* repository asks for a rebuild: that repository's own
# release fires no event here, so either its workflow or the webhook receiver
# `ghr-pypi webhook` generates POSTs to this repo's dispatches endpoint. See
# the "How do I rebuild when another repository releases?" how-to.
#
# NOTE: this fails by design while the repository has no releases yet —
# ghr-pypi refuses to deploy an empty index.
name: pages

on:
  release:
    types: [published, deleted]
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [ghr-pypi-rebuild]

permissions: {} # no default permissions; each job declares only what it needs

# Latest-wins: a newer index build supersedes an in-flight one. (GitHub's
# Pages starter uses cancel-in-progress: false to protect production
# deploys; for an index rebuilt from scratch each run, newest data wins.)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout the repo and release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: false

      # Runs the ghr-pypi CLI from this repo's own source — the repo
      # dogfoods the tool it publishes. Other repos would use:
      #   uvx ghr-pypi index
      # With no repository argument `index` builds $GITHUB_REPOSITORY into
      # _site, which is also upload-pages-artifact's default path.
      - name: Build the package index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked --no-default-groups ghr-pypi index

      # Fails fast with a clear error if Pages isn't enabled for this repo.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy the built site to GitHub Pages
      id-token: write # required to authenticate the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
