name: Test

# Standard testing workflow on Linux, Windows, and macOS.

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    # No tag filter, deliberately. "If you define only tags/tags-ignore or only
    # branches/branches-ignore, the workflow won't run for events affecting the
    # undefined Git ref" — so `branches` alone already excludes every tag push,
    # and a tagged release still runs these tests through release.yml's
    # `uses:` of this workflow. A redundant `tags-ignore` is not free: zizmor's
    # cache-poisoning audit keys on `push.tag_filters.is_some()`, which does not
    # distinguish TagsIgnore from Tags, so it read this workflow as publishing
    # from a tag and failed on the caching actions/setup-node enables by default.
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/test.yml"
      - "pyproject.toml"
      - "justfile"
  merge_group:
  workflow_call:
  workflow_dispatch:
    inputs:
      debug:
        description: "Open ssh debug session."
        required: true
        default: false
        type: boolean
      clear_cache:
        description: "Clear GitHub Tool cache."
        required: true
        default: false
        type: boolean
  schedule:
    # Every Sunday at 9:00 AM Los Angeles time (17:00 UTC).
    - cron: "0 17 * * 0"

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        dependencies:
          - "lowest-direct"
          - "highest"
        exclude:
          # test lower dependency bounds on the oldest python only
          - python-version: "3.10"
            dependencies: "highest"
          - python-version: "3.11"
            dependencies: "lowest-direct"
          - python-version: "3.12"
            dependencies: "lowest-direct"
          - python-version: "3.13"
            dependencies: "lowest-direct"
          - python-version: "3.14"
            dependencies: "lowest-direct"
          - python-version: "3.15"
            dependencies: "lowest-direct"
    env:
      COVERAGE_FILE: linux-py${{ matrix.python-version }}.coverage
      TEST_PYTHON_VERSION: ${{ matrix.python-version }}
      DEPENDENCY_RESOLUTION: ${{ matrix.dependencies }}
    steps:
      - name: Clear Tool cache
        if: ${{ github.event.inputs.clear_cache == 'true' }}
        run: sudo rm -rf /opt/hostedtoolcache
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: sp
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
      - name: Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      # tests/test_nginx_live.py runs the generated config through real nginx
      # and skips where the binary is absent — and no runner image ships it,
      # so without this step that suite skips on every job of every run. This
      # is the only leg it is installed on, deliberately: the point is that
      # those tests execute somewhere on every push, not everywhere. The
      # macOS and Windows legs keep skipping them.
      - name: Install nginx
        run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Install Emacs
        if: ${{ github.event.inputs.debug == 'true' }}
        run: |
          sudo apt install emacs
      - name: Setup tmate session
        if: ${{ github.event.inputs.debug == 'true' }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113
        timeout-minutes: 60
      - name: Run Unit Tests
        env:
          TEST_PYTHON: ${{ steps.sp.outputs.python-path }}
        run: |
          just test-all -p "$TEST_PYTHON" --resolution "$DEPENDENCY_RESOLUTION"
      - name: Store coverage files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.COVERAGE_FILE }}
          path: ${{ env.COVERAGE_FILE }}

  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.15"]
        dependencies:
          - "lowest-direct"
          - "highest"
        exclude:
          - python-version: "3.10"
            dependencies: "highest"
          - python-version: "3.15"
            dependencies: "lowest-direct"
    env:
      COVERAGE_FILE: windows-py${{ matrix.python-version }}.coverage
      TEST_PYTHON_VERSION: ${{ matrix.python-version }}
      DEPENDENCY_RESOLUTION: ${{ matrix.dependencies }}
    steps:
      - name: Clear Tool cache
        if: ${{ github.event.inputs.clear_cache == 'true' }}
        run: sudo rm -rf /opt/hostedtoolcache
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: sp
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
      - name: Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - name: install-vim-windows
        if: ${{ github.event.inputs.debug == 'true' }}
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7
      - name: Setup tmate session
        if: ${{ github.event.inputs.debug == 'true' }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113
        timeout-minutes: 60
      - name: Run Unit Tests
        env:
          TEST_PYTHON: ${{ steps.sp.outputs.python-path }}
        run: |
          just test-all -p $env:TEST_PYTHON --resolution $env:DEPENDENCY_RESOLUTION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Store coverage files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.COVERAGE_FILE }}
          path: ${{ env.COVERAGE_FILE }}

  test-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.15"]
        dependencies:
          - "lowest-direct"
          - "highest"
        exclude:
          - python-version: "3.10"
            dependencies: "highest"
          - python-version: "3.15"
            dependencies: "lowest-direct"
    env:
      COVERAGE_FILE: macos-py${{ matrix.python-version }}.coverage
      TEST_PYTHON_VERSION: ${{ matrix.python-version }}
      DEPENDENCY_RESOLUTION: ${{ matrix.dependencies }}
    steps:
      - name: Clear Tool cache
        if: ${{ github.event.inputs.clear_cache == 'true' }}
        run: sudo rm -rf /opt/hostedtoolcache
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: sp
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
      - name: Setup Just
        run: |
          brew install just
      - name: install-emacs-macos
        if: ${{ github.event.inputs.debug == 'true' }}
        run: |
          brew install emacs
      - name: Setup tmate session
        if: ${{ github.event.inputs.debug == 'true' }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113
        timeout-minutes: 60
      - name: Run Unit Tests
        env:
          TEST_PYTHON: ${{ steps.sp.outputs.python-path }}
        run: |
          just test-all -p "$TEST_PYTHON" --resolution "$DEPENDENCY_RESOLUTION"
      - name: Store coverage files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.COVERAGE_FILE }}
          path: ${{ env.COVERAGE_FILE }}

  # The redirector is the auth boundary for a private index, so a failure here
  # must block a release. release.yml consumes this workflow with `uses:` and
  # its publish jobs declare `needs: test`, which succeeds only when EVERY job
  # here succeeds — so this job's presence is what makes it release-blocking.
  test-worker:
    name: Worker Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - name: Run Worker Tests
        run: just test-worker
      - name: Store worker coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          # What keeps this out of `coverage combine` is the FILE name below:
          # `just coverage` globs *.coverage on disk, and an extracted file is
          # named by `path:`, never by `name:`. Keeping the artifact name clear
          # of *.coverage too is hygiene, so the artifact and file namespaces
          # do not drift apart.
          name: worker-lcov
          path: worker.lcov

  coverage-combine:
    needs: [test-linux, test-windows, test-macos, test-worker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for oidc authentication to codecov
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
      - name: Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - name: Get coverage files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          # Keep this pattern narrow. Artifacts are scoped to the whole run, and
          # release.yml calls this workflow with `uses:` alongside a `build` job
          # that declares no `needs:` — so it can have already uploaded
          # python-package-distributions and demo-package-distributions by the
          # time this step runs. "*" would drop those wheels into the workspace.
          pattern: "*.coverage"
          merge-multiple: true
      - run: ls -la *.coverage
      - run: just coverage
      # Fetched late simply because nothing before this step needs it.
      - name: Get worker coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: worker-lcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          use_oidc: true
          files: ./coverage.xml
          flags: python
      - name: Upload worker coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          use_oidc: true
          files: ./worker.lcov
          flags: worker
