[project]
name = "ghr-pypi"
dynamic = ["version"]
description = "Tools for creating Python package indexes from GitHub release assets."
requires-python = ">=3.10,<4.0"
authors = [
  {name = "Brian Kohan", email = "bckohan@gmail.com"},
]
license = "MIT"
license-files = [ "LICENSE" ]

readme = "README.md"
repository = "https://github.com/bckohan/ghr-pypi"
homepage = "https://ghr-pypi.readthedocs.io"
keywords = []
dependencies = [
    # 0.16 is the first release whose TyperArgument.make_metavar() takes ctx,
    # as click >= 8.2 requires; older typer TypeErrors on any usage/help render.
    "typer>=0.16",
    "jinja2>=3.1",
    "pyyaml>=6",
    "packaging>=23",
]
classifiers = [
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",

    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed"
]

[project.scripts]
ghr-pypi = "ghr_pypi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.uv.sources]
ghr-pypi-demo-lib = { path = "packages/demo-lib", editable = true }
ghr-pypi-demo-app = { path = "packages/demo-app", editable = true }

[tool.hatch.version]
source = "code"
path = "src/ghr_pypi/_version.py"
expression = "get_version()"

[tool.hatch.build.targets.wheel]
packages = ["src/ghr_pypi"]

[project.urls]
"Homepage"      = "https://ghr-pypi.readthedocs.io"
"Documentation" = "https://ghr-pypi.readthedocs.io"
"Repository"    = "https://github.com/bckohan/ghr-pypi"
"Issues"        = "https://github.com/bckohan/ghr-pypi/issues"
"Changelog"     = "https://ghr-pypi.readthedocs.io/en/latest/changelog.html"

[dependency-groups]
docs = [
    "doc8>=1.1.2",
    "furo>=2024.8.6",
    "myst-parser>=4.0",
    "readme-renderer[md]>=45.0",
    "sphinx>=8.0.0",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-tabs>=3.4.7",
    "sphinxcontrib-typer>=0.5",
]
typing = [
    "pyright>=1.1.390",
    "mypy>=1.19.1",
    "types-pyyaml",
]
lint = [
    "ruff>=0.15.0",
    "readme-renderer[md]>=45.0",
    "doc8>=1.1.2",
    "bandit[toml,sarif]>=1.9.4"
]
coverage  = ["coverage[toml]>=7.15.2"]
test = [
    { include-group = "coverage" },
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "packaging>=24.2",
    "ghr-pypi-demo-lib",
    "ghr-pypi-demo-app",
]
dev = [
    { include-group = "typing" },
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "lint" },
    "packaging>=24.2",
    "tomlkit>=0.13.3",
    "ipdb>=0.13.13",
    "ipython>=8.18.1",
    "pygount>=3.2.0",
]

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
mypy_path = ["src"]
packages = ["ghr_pypi"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["src/ghr_pypi"]
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportDuplicateImport = true

[tool.doc8]
max-line-length = 100
sphinx = true
# doc8 parses with bare docutils and follows ``include`` directives, so it chokes on
# index.rst's MyST include of the README (that parser requires a Sphinx environment).
ignore-path = ["doc/source/index.rst"]

[tool.pytest.ini_options]
python_files = "test*.py"
norecursedirs = "*.egg .eggs dist build docs .tox .git __pycache__"
addopts = [
    # tests/test_nginx_live.py skips wherever nginx is absent, and a bare
    # "10 skipped" count is indistinguishable from a suite that has quietly
    # stopped running anywhere. -ra prints the reason, so a suite that skips
    # everywhere says so instead of reading as a pass.
    "-ra",
    "--strict-markers",
    "--cov=ghr_pypi",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
]

[tool.coverage.run]
branch = true
source = ["ghr_pypi"]
concurrency = ["thread", "multiprocessing"]
parallel = true
relative_files = true
command_line = "-m pytest --cov=ghr_pypi"

[tool.coverage.paths]
source = ["ghr_pypi"]

[tool.ruff]
line-length = 88
exclude = ["doc", "dist", "docs"]
target-version = "py310"

[tool.ruff.lint]
exclude = ["tests/**/*"]

[tool.bandit]
targets = ["src"]
exclude_dirs = [
    "./tests",
    "./.venv",
    "./doc",
]

skips = [
    "B101",  # assert_used - assertions are fine in tests
    "B110",  # Try, Except, Pass detected - these are intentional
]
